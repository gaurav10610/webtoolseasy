services:
  postgres:
    image: postgres:16-alpine
    container_name: webtoolseasy-local-postgres
    environment:
      POSTGRES_DB: webtoolseasy
      POSTGRES_USER: webtoolseasy
      POSTGRES_PASSWORD: webtoolseasy
    ports:
      - "5434:5432"
    volumes:
      - webtoolseasy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtoolseasy -d webtoolseasy"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  webtoolseasy_pgdata:
